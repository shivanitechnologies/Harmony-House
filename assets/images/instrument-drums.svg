<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%" style="overflow: visible; filter: drop-shadow(0 20px 35px rgba(0,0,0,0.4));">
  <defs>
    <!-- Deep Shell Gradient -->
    <linearGradient id="drumShell" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF9F43" />
      <stop offset="40%" stop-color="#E87451" />
      <stop offset="80%" stop-color="#6C4CE3" />
      <stop offset="100%" stop-color="#2D1A5C" />
    </linearGradient>

    <!-- Chrome Hardware -->
    <linearGradient id="drumChrome" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E2E8F0" />
      <stop offset="50%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#94A3B8" />
    </linearGradient>

    <!-- Bronze Cymbal Gradient -->
    <radialGradient id="cymbalGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFF3C4" />
      <stop offset="25%" stop-color="#FCD34D" />
      <stop offset="60%" stop-color="#D97706" />
      <stop offset="85%" stop-color="#92400E" />
      <stop offset="100%" stop-color="#451A03" />
    </radialGradient>

    <!-- Drumhead Mylar Gradient -->
    <radialGradient id="drumHead" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="70%" stop-color="#F1F5F9" />
      <stop offset="100%" stop-color="#CBD5E1" />
    </radialGradient>
  </defs>

  <!-- 1. BASS DRUM (KICK) -->
  <g id="kickDrum" transform="translate(170, 200)">
    <!-- Shell Cylinder -->
    <ellipse cx="80" cy="110" rx="90" ry="90" fill="url(#drumShell)" stroke="#1E1B4B" stroke-width="3" />
    <!-- Front Resonant Drumhead -->
    <circle cx="80" cy="110" r="82" fill="#0F172A" stroke="url(#drumChrome)" stroke-width="6" />
    <!-- Inner Sound Port -->
    <circle cx="120" cy="130" r="22" fill="#020617" stroke="url(#drumChrome)" stroke-width="2" />
    <!-- Bass Drum Tension Rods / Claws -->
    <circle cx="80" cy="28" r="5" fill="url(#drumChrome)" />
    <circle cx="138" cy="52" r="5" fill="url(#drumChrome)" />
    <circle cx="162" cy="110" r="5" fill="url(#drumChrome)" />
    <circle cx="138" cy="168" r="5" fill="url(#drumChrome)" />
    <circle cx="80" cy="192" r="5" fill="url(#drumChrome)" />
    <circle cx="22" cy="168" r="5" fill="url(#drumChrome)" />
    <circle cx="-2" cy="110" r="5" fill="url(#drumChrome)" />
    <circle cx="22" cy="52" r="5" fill="url(#drumChrome)" />
    <!-- Academy Logo on Bass Drumhead -->
    <circle cx="80" cy="95" r="14" fill="#6C4CE3" opacity="0.8" />
    <path d="M 77 90 L 83 87 V 97 L 77 100 Z" fill="#FF9F43" />
  </g>

  <!-- 2. SNARE DRUM (LEFT) -->
  <g id="snareDrum" transform="translate(60, 240)">
    <!-- Stand -->
    <line x1="60" y1="90" x2="60" y2="180" stroke="url(#drumChrome)" stroke-width="5" />
    <line x1="60" y1="180" x2="30" y2="230" stroke="url(#drumChrome)" stroke-width="4" />
    <line x1="60" y1="180" x2="90" y2="230" stroke="url(#drumChrome)" stroke-width="4" />
    <!-- Shell -->
    <path d="M 15 50 L 15 85 C 15 100 105 100 105 85 L 105 50 Z" fill="url(#drumShell)" stroke="#1E1B4B" stroke-width="2" />
    <!-- Chrome Hoop & Batter Head -->
    <ellipse cx="60" cy="50" rx="46" ry="18" fill="url(#drumHead)" stroke="url(#drumChrome)" stroke-width="5" />
    <!-- Lug Casings -->
    <rect x="25" y="55" width="6" height="25" rx="2" fill="url(#drumChrome)" />
    <rect x="57" y="58" width="6" height="26" rx="2" fill="url(#drumChrome)" />
    <rect x="89" y="55" width="6" height="25" rx="2" fill="url(#drumChrome)" />
  </g>

  <!-- 3. RACK TOM (MOUNTED CENTER) -->
  <g id="rackTom" transform="translate(190, 110)">
    <path d="M 15 45 L 15 80 C 15 95 95 95 95 80 L 95 45 Z" fill="url(#drumShell)" stroke="#1E1B4B" stroke-width="2" />
    <ellipse cx="55" cy="45" rx="40" ry="16" fill="url(#drumHead)" stroke="url(#drumChrome)" stroke-width="4" />
    <rect x="30" y="50" width="5" height="24" rx="2" fill="url(#drumChrome)" />
    <rect x="52" y="52" width="5" height="26" rx="2" fill="url(#drumChrome)" />
    <rect x="75" y="50" width="5" height="24" rx="2" fill="url(#drumChrome)" />
  </g>

  <!-- 4. FLOOR TOM (RIGHT) -->
  <g id="floorTom" transform="translate(320, 220)">
    <!-- 3 Chrome Legs -->
    <line x1="25" y1="100" x2="10" y2="230" stroke="url(#drumChrome)" stroke-width="4" />
    <line x1="95" y1="100" x2="110" y2="230" stroke="url(#drumChrome)" stroke-width="4" />
    <!-- Shell -->
    <path d="M 15 50 L 15 110 C 15 125 105 125 105 110 L 105 50 Z" fill="url(#drumShell)" stroke="#1E1B4B" stroke-width="2" />
    <!-- Head -->
    <ellipse cx="60" cy="50" rx="46" ry="18" fill="url(#drumHead)" stroke="url(#drumChrome)" stroke-width="5" />
    <rect x="25" y="60" width="6" height="35" rx="2" fill="url(#drumChrome)" />
    <rect x="57" y="64" width="6" height="38" rx="2" fill="url(#drumChrome)" />
    <rect x="89" y="60" width="6" height="35" rx="2" fill="url(#drumChrome)" />
  </g>

  <!-- 5. CRASH CYMBAL (TOP RIGHT) -->
  <g id="crashCymbal" transform="translate(330, 40)">
    <line x1="70" y1="45" x2="70" y2="240" stroke="url(#drumChrome)" stroke-width="5" />
    <!-- Angled Bronze Cymbal Disc -->
    <ellipse cx="70" cy="45" rx="65" ry="16" fill="url(#cymbalGrad)" stroke="#78350F" stroke-width="1.5" transform="rotate(-8 70 45)" />
    <!-- Bell -->
    <ellipse cx="70" cy="45" rx="14" ry="5" fill="#FEF3C7" stroke="#92400E" stroke-width="1" transform="rotate(-8 70 45)" />
    <circle cx="70" cy="45" r="4" fill="url(#drumChrome)" />
  </g>

  <!-- 6. HI-HAT CYMBALS (TOP LEFT) -->
  <g id="hiHat" transform="translate(40, 90)">
    <line x1="60" y1="50" x2="60" y2="280" stroke="url(#drumChrome)" stroke-width="5" />
    <!-- Top & Bottom Cymbals -->
    <ellipse cx="60" cy="68" rx="55" ry="14" fill="url(#cymbalGrad)" stroke="#78350F" stroke-width="1.2" />
    <ellipse cx="60" cy="65" rx="54" ry="13" fill="url(#cymbalGrad)" stroke="#78350F" stroke-width="1.2" />
    <circle cx="60" cy="65" r="3.5" fill="url(#drumChrome)" />
  </g>

  <!-- 7. DRUMSTICKS (CROSSING IN MIDAIR) -->
  <g id="drumsticks">
    <!-- Left Stick -->
    <polygon points="120,180 126,183 230,300 224,303" fill="#FDE68A" stroke="#B45309" stroke-width="1" filter="drop-shadow(0 4px 6px rgba(0,0,0,0.5))" />
    <!-- Right Stick -->
    <polygon points="260,170 254,173 150,290 156,293" fill="#FDE68A" stroke="#B45309" stroke-width="1" filter="drop-shadow(0 4px 6px rgba(0,0,0,0.5))" />
  </g>
</svg>

