<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 1100" width="100%" height="100%" style="overflow: visible; filter: drop-shadow(0 20px 30px rgba(0,0,0,0.3));">
  <defs>
    <!-- Vintage Black Gloss Body -->
    <linearGradient id="stratBodyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3A3D40" />
      <stop offset="30%" stop-color="#1A1C1E" />
      <stop offset="70%" stop-color="#0E0F10" />
      <stop offset="100%" stop-color="#050506" />
    </linearGradient>

    <!-- Chrome Sheen -->
    <linearGradient id="stratChrome" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E0E0E0" />
      <stop offset="50%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#9E9E9E" />
    </linearGradient>

    <!-- Maple Neck & Fretboard -->
    <linearGradient id="mapleNeck" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E8C99B" />
      <stop offset="50%" stop-color="#F7DFBE" />
      <stop offset="100%" stop-color="#DCB682" />
    </linearGradient>

    <!-- 3-Ply Mint White Pickguard -->
    <linearGradient id="stratPickguard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#EAECE8" />
    </linearGradient>
  </defs>

  <!-- HEADSTOCK (Classic Strat reverse curve) -->
  <g id="stratHeadstock" transform="translate(0, 15)">
    <path d="M 180 135 L 175 40 C 175 25 190 12 210 15 C 235 18 245 35 240 55 C 235 75 230 85 235 105 L 230 135 Z" fill="url(#mapleNeck)" stroke="#B88E56" stroke-width="1.5" />
    <!-- 6 Inline Tuning Pegs (Left side) -->
    <circle cx="165" cy="40" r="6" fill="url(#stratChrome)" stroke="#777" stroke-width="1" />
    <circle cx="165" cy="58" r="6" fill="url(#stratChrome)" stroke="#777" stroke-width="1" />
    <circle cx="165" cy="76" r="6" fill="url(#stratChrome)" stroke="#777" stroke-width="1" />
    <circle cx="165" cy="94" r="6" fill="url(#stratChrome)" stroke="#777" stroke-width="1" />
    <circle cx="165" cy="112" r="6" fill="url(#stratChrome)" stroke="#777" stroke-width="1" />
    <circle cx="165" cy="130" r="6" fill="url(#stratChrome)" stroke="#777" stroke-width="1" />
    <rect x="180" y="133" width="50" height="6" rx="1.5" fill="#FAF5E8" stroke="#CCC" stroke-width="0.8" />
  </g>

  <!-- NECK & FRETBOARD (Maple with Black Dot Inlays) -->
  <g id="stratNeck">
    <path d="M 180 155 L 172 530 L 228 530 L 220 155 Z" fill="url(#mapleNeck)" stroke="#A67B43" stroke-width="1" />
    <!-- Frets & Black Dots -->
    <line x1="180" y1="210" x2="220" y2="210" stroke="#BBB" stroke-width="1.6" />
    <circle cx="200" cy="235" r="2.8" fill="#1A1C1E" /> <!-- 3 -->
    <line x1="178" y1="260" x2="222" y2="260" stroke="#BBB" stroke-width="1.6" />
    <circle cx="200" cy="285" r="2.8" fill="#1A1C1E" /> <!-- 5 -->
    <line x1="176" y1="310" x2="224" y2="310" stroke="#BBB" stroke-width="1.6" />
    <circle cx="200" cy="340" r="2.8" fill="#1A1C1E" /> <!-- 7 -->
    <line x1="174" y1="370" x2="226" y2="370" stroke="#BBB" stroke-width="1.6" />
    <circle cx="200" cy="405" r="2.8" fill="#1A1C1E" /> <!-- 9 -->
    <line x1="173" y1="440" x2="227" y2="440" stroke="#BBB" stroke-width="1.6" />
    <circle cx="194" cy="475" r="2.5" fill="#1A1C1E" /> <!-- 12 double -->
    <circle cx="206" cy="475" r="2.5" fill="#1A1C1E" />
    <line x1="172" y1="510" x2="228" y2="510" stroke="#BBB" stroke-width="1.6" />
  </g>

  <!-- ELECTRIC DOUBLE-CUTAWAY BODY -->
  <g id="stratBody">
    <!-- Double-horn contour -->
    <path d="M 172 530 
             C 140 510 110 470 95 440 
             C 90 430 80 435 82 455 
             C 85 490 100 540 105 580 
             C 110 620 90 660 85 710 
             C 75 790 105 870 145 920 
             C 180 960 220 960 255 920 
             C 295 870 325 790 315 710 
             C 310 660 290 620 295 580 
             C 300 540 315 490 318 455 
             C 320 435 310 430 305 440 
             C 290 470 260 510 228 530 Z" 
          fill="url(#stratBodyGrad)" 
          stroke="#000000" 
          stroke-width="3" />

    <!-- Gloss Highlight -->
    <path d="M 125 580 C 130 630 115 700 110 750 C 105 800 120 860 150 900" fill="none" stroke="#FFFFFF" stroke-width="4" opacity="0.18" stroke-linecap="round" />

    <!-- Mint 3-Ply Pickguard -->
    <path d="M 165 540 
             C 130 540 110 570 115 620 
             C 120 670 140 700 135 760 
             C 130 820 170 870 200 870 
             C 230 870 260 830 265 770 
             C 270 700 240 650 245 600 
             C 250 560 230 540 200 540 Z" 
          fill="url(#stratPickguard)" 
          stroke="#CCD1C9" 
          stroke-width="1.8" />

    <!-- 3 Single-Coil Pickups -->
    <!-- Neck Pickup -->
    <rect x="180" y="580" width="40" height="14" rx="4" fill="#F4F4F0" stroke="#BBB" stroke-width="1" />
    <circle cx="185" cy="587" r="1.8" fill="url(#stratChrome)" />
    <circle cx="191" cy="587" r="1.8" fill="url(#stratChrome)" />
    <circle cx="197" cy="587" r="1.8" fill="url(#stratChrome)" />
    <circle cx="203" cy="587" r="1.8" fill="url(#stratChrome)" />
    <circle cx="209" cy="587" r="1.8" fill="url(#stratChrome)" />
    <circle cx="215" cy="587" r="1.8" fill="url(#stratChrome)" />

    <!-- Middle Pickup -->
    <rect x="180" y="630" width="40" height="14" rx="4" fill="#F4F4F0" stroke="#BBB" stroke-width="1" />
    <circle cx="185" cy="637" r="1.8" fill="url(#stratChrome)" />
    <circle cx="191" cy="637" r="1.8" fill="url(#stratChrome)" />
    <circle cx="197" cy="637" r="1.8" fill="url(#stratChrome)" />
    <circle cx="203" cy="637" r="1.8" fill="url(#stratChrome)" />
    <circle cx="209" cy="637" r="1.8" fill="url(#stratChrome)" />
    <circle cx="215" cy="637" r="1.8" fill="url(#stratChrome)" />

    <!-- Bridge Pickup (Angled) -->
    <g transform="rotate(-6 200 685)">
      <rect x="180" y="680" width="40" height="14" rx="4" fill="#F4F4F0" stroke="#BBB" stroke-width="1" />
      <circle cx="185" cy="687" r="1.8" fill="url(#stratChrome)" />
      <circle cx="191" cy="687" r="1.8" fill="url(#stratChrome)" />
      <circle cx="197" cy="687" r="1.8" fill="url(#stratChrome)" />
      <circle cx="203" cy="687" r="1.8" fill="url(#stratChrome)" />
      <circle cx="209" cy="687" r="1.8" fill="url(#stratChrome)" />
      <circle cx="215" cy="687" r="1.8" fill="url(#stratChrome)" />
    </g>

    <!-- Synchronized Tremolo Chrome Bridge -->
    <rect x="175" y="730" width="50" height="28" rx="3" fill="url(#stratChrome)" stroke="#777" stroke-width="1" />
    <!-- Tremolo Arm -->
    <path d="M 220 745 L 245 775 L 235 830" fill="none" stroke="url(#stratChrome)" stroke-width="3" stroke-linecap="round" />

    <!-- Volume & Tone Control Knobs -->
    <circle cx="230" cy="790" r="8" fill="#F4F4F0" stroke="#BBB" stroke-width="1" />
    <circle cx="240" cy="815" r="8" fill="#F4F4F0" stroke="#BBB" stroke-width="1" />
    <circle cx="245" cy="840" r="8" fill="#F4F4F0" stroke="#BBB" stroke-width="1" />
  </g>

  <!-- STRINGS -->
  <g id="stratStrings">
    <line x1="184" y1="145" x2="182" y2="735" stroke="url(#stratChrome)" stroke-width="2" opacity="0.9" />
    <line x1="190" y1="145" x2="189" y2="735" stroke="url(#stratChrome)" stroke-width="1.7" opacity="0.9" />
    <line x1="196" y1="145" x2="196" y2="735" stroke="url(#stratChrome)" stroke-width="1.4" opacity="0.9" />
    <line x1="202" y1="145" x2="203" y2="735" stroke="url(#stratChrome)" stroke-width="1.2" opacity="0.9" />
    <line x1="208" y1="145" x2="210" y2="735" stroke="url(#stratChrome)" stroke-width="1.0" opacity="0.85" />
    <line x1="214" y1="145" x2="217" y2="735" stroke="url(#stratChrome)" stroke-width="0.8" opacity="0.85" />
  </g>
</svg>

