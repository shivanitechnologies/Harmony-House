<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 64" fill="none" class="w-auto h-10">
  <defs>
    <!-- 3D Depth Shadow Filter -->
    <filter id="hh-3d-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#6C4CE3" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- 3D Musical Icon Mark (Solid Deep Purple & Warm Orange) -->
  <g transform="translate(4, 6)" filter="url(#hh-3d-shadow)">
    <!-- Solid Shield Backdrop in Deep Purple -->
    <rect x="0" y="0" width="52" height="52" rx="16" fill="#6C4CE3" />
    
    <!-- Inner 3D Highlight Bevel -->
    <rect x="2" y="2" width="48" height="24" rx="14" fill="#6C4CE3" opacity="0.3" />
    
    <!-- Solid Connected Double Musical Note in Warm Orange -->
    <circle cx="18" cy="35" r="5.5" fill="#FF9F43" />
    <circle cx="35" cy="31" r="5" fill="#FF9F43" />
    
    <!-- Note Stems -->
    <path d="M 23.5 35 V 17 C 23.5 17 28 15.5 35 13 V 31" stroke="#FF9F43" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    <path d="M 40 31 V 14" stroke="#FF9F43" stroke-width="3" stroke-linecap="round" fill="none" />
    
    <!-- Solid Note Beam Bar in Warm Orange -->
    <path d="M 22 16 L 41 12.5 V 17.5 L 22 21 Z" fill="#FF9F43" />
    
    <!-- Solid Resonance Dots -->
    <circle cx="28" cy="27" r="1.5" fill="#FF9F43" />
  </g>

  <!-- Typography Brandmark (Strict Two Colors: Deep Purple & Warm Orange) -->
  <text x="68" y="32" font-family="'Playfair Display', Georgia, serif" font-weight="700" font-size="22" letter-spacing="-0.02em">
    <tspan fill="#6C4CE3">Harmony</tspan><tspan fill="#FF9F43">House</tspan>
  </text>
  <text x="69" y="47" font-family="'DM Sans', sans-serif" font-weight="700" font-size="9" fill="#6C4CE3" letter-spacing="0.22em" text-transform="uppercase">
    MUSIC ACADEMY
  </text>
</svg>
